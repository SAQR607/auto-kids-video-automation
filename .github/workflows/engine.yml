name: engine

# Narrative Stickman Engine gate (Phase 1): the same mini-plan rendered twice must
# produce identical frame hashes, plus a short sample-video smoke render.
# Test-only: never publishes, never writes state, never touches Fernwood workflows.

on:
  push:
    branches: [master]
    paths:
      - 'engine-js/**'
      - 'app/render/engine/**'
      - 'tests/test_engine_determinism.py'
      - 'vendor/lemo-opuscar/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'engine-js/**'
      - 'app/render/engine/**'
      - 'tests/test_engine_determinism.py'
      - 'vendor/lemo-opuscar/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

# job-level-by-default read-only token; this workflow has no write job at all
permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Cache Chromium headless shell (pinned by the lock hash, plan 12.4)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Node dependencies (exact lock, plan 12.4)
        run: npm ci
      - name: Install Chromium headless shell (version = playwright-core lock)
        run: node node_modules/playwright-core/cli.js install chromium-headless-shell
      - name: Install ffmpeg (not on runner image)
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: python -m pip install pytest
      - name: Determinism gate (same plan twice → identical frame hashes)
        run: python -m pytest -q tests/test_engine_determinism.py
